[project]
name = "remnant"
version = "0.1.0"
description = "REMNANT — a persistent Minds agent that remembers unresolved audience needs across time"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]